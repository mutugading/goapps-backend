# Payroll Service Configuration

app:
  name: payroll-service
  version: "0.1.0"
  env: development  # development, staging, production

server:
  grpc_port: 50054
  http_port: 8084
  grpc_timeout: 60s

# Always payroll_app (RLS applies). Migrations run as payroll_migrator.
database:
  host: localhost
  port: 5437
  user: payroll_app
  password: payroll_app123
  name: payroll
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

jwt:
  access_token_secret: "change-this-in-production"  # Override via JWT_ACCESS_SECRET (must match IAM)

cors:
  allowed_origins:
    - "http://localhost:3000"
  max_age: 300

tracing:
  enabled: true
  service_name: payroll-service
  endpoint: localhost:4317
  insecure: true

logger:
  level: debug   # debug, info, warn, error
  format: console  # console, json
  pretty_json: false

pii:  # D-17: override via PAYROLL_PII_KEY / PAYROLL_PII_HMAC_KEY (>= 32 bytes outside development)
  enc_key: "dev-pii-enc-key-change-in-production"
  hmac_key: "dev-pii-hmac-key-change-in-production"
