# Payroll Service Configuration

app:
  name: payroll-service
  version: "0.1.0"
  env: development  # development, staging, production

server:
  grpc_port: 50054
  http_port: 8084
  grpc_timeout: 60s

# Not dialed yet (T001 scaffold). Wired once payroll-postgres (T002) and the
# baseline migrations (T003) exist.
database:
  host: localhost
  port: 5437
  user: payroll_app
  password: payroll_app123
  name: payroll
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

cors:
  allowed_origins:
    - "http://localhost:3000"
  max_age: 300

tracing:
  enabled: true
  service_name: payroll-service
  endpoint: localhost:4317
  insecure: true

logger:
  level: debug   # debug, info, warn, error
  format: console  # console, json
  pretty_json: false
