name: Payroll Service CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/payroll/**'
      - 'gen/**'
      - '.github/workflows/payroll-service.yml'
      - '.golangci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/payroll/**'
      - 'gen/**'
      - '.golangci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  GOLANGCI_LINT_VERSION: 'v2.15.0'  # NOT the service Makefile's v1.62.2 — v1 cannot parse a `version: "2"` config
  SERVICE_NAME: payroll-service
  WORKING_DIR: ./services/payroll

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # Disable built-in cache, use golangci cache instead

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ env.WORKING_DIR }}
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    # Runs in parallel with lint job. Unit tests only: the integration/e2e/isolation suites (tests/**) start
    # PostgreSQL 18 with testcontainers and read deploy/payroll/bootstrap.sql from the workspace repo (not in
    # this repo), so they run locally (`make test-e2e`) until that bootstrap is available to CI.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Download dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod download

      # `-short` skips the testcontainers suites; tests/** are gated by INTEGRATION_TEST and stay out of CI.
      - name: Run unit tests
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          go test -v -race -short -coverprofile=coverage.out -covermode=atomic ./internal/... ./cmd/...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ${{ env.WORKING_DIR }}/coverage.out
          flags: ${{ env.SERVICE_NAME }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]  # Wait for both lint and test to pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/go.sum'

      # server + the operator CLIs (sync, report, mailer, recon) that the image also ships (D-62 (3)).
      - name: Build binaries
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${{ github.sha }}" \
            -o ./bin/${{ env.SERVICE_NAME }} \
            ./cmd/server/main.go
          for c in sync report mailer recon; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "./bin/payroll-$c" "./cmd/$c"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SERVICE_NAME }}-binary
          path: ${{ env.WORKING_DIR }}/bin/
          retention-days: 7

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The bare-SHA tag (`prefix=`) is load-bearing: ArgoCD Image Updater
      # matches `allow-tags: regexp:^[a-f0-9]{7,40}$`, so any prefix silently
      # breaks auto-deploy.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.SERVICE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # context is the repo root: the Dockerfile copies gen/ and services/payroll/.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.WORKING_DIR }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  # No `e2e` job (see the test job): deploy-staging depends on `docker`.
  deploy-staging:
    name: Deploy to Staging
    runs-on: [self-hosted, staging, goapps-runner]
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging-goapps.mutugading.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Notify ArgoCD to sync
        run: |
          echo "Staging deployment triggered via ArgoCD auto-sync"
          echo "Image: ghcr.io/mutugading/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          # ArgoCD will auto-sync when it detects new image

  deploy-production:
    name: Deploy to Production
    runs-on: [self-hosted, production, goapps-runner]
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://goapps.mutugading.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Trigger Production Deploy via ArgoCD
        run: |
          echo "Production deployment requires manual ArgoCD sync"
          echo "Image: ghcr.io/mutugading/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          # Manual sync required in ArgoCD dashboard
